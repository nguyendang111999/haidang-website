name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

# Prevent concurrent deploys stepping on each other.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        # Using `npm install` (not `npm ci`) because platform-optional deps
        # like `@tailwindcss/oxide-wasm32-wasi` cause lockfile mismatches
        # when the lockfile is generated on Windows and consumed on Linux.
        run: npm install --no-audit --no-fund

      - name: Build site
        run: npm run build

      - name: Deploy to Hostinger over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          # Hostinger's FTP account root is ABOVE public_html (contains a
          # `DO_NOT_UPLOAD_HERE` marker file), so the docroot is /public_html/.
          server-dir: ./public_html/
          # TEMPORARY: wipe the target folder and do a fresh full upload to
          # clear the stale sync-state file left by earlier misconfigured
          # deploys. After the next successful deploy, remove this line so
          # subsequent runs only sync changed files.
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
